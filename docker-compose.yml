services:
  postgres:
    image: postgres:16-alpine
    container_name: fip-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fip_core}
      POSTGRES_USER: ${POSTGRES_USER:-fip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fip_user} -d ${POSTGRES_DB:-fip_core}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fip-core-network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: fip-core-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_me}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fip-core-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fip-core-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://fip_user:change_me@postgres:5432/fip_core?schema=public}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_NAME: ${ADMIN_NAME:-FIP Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      JOB_IMPORT_REDE_TRANSACTIONS_ENABLED: ${JOB_IMPORT_REDE_TRANSACTIONS_ENABLED:-true}
      JOB_IMPORT_REDE_TRANSACTIONS_CRON: ${JOB_IMPORT_REDE_TRANSACTIONS_CRON:-0 6 * * *}
      JOB_IMPORT_REDE_RECEIVABLES_ENABLED: ${JOB_IMPORT_REDE_RECEIVABLES_ENABLED:-true}
      JOB_IMPORT_REDE_RECEIVABLES_CRON: ${JOB_IMPORT_REDE_RECEIVABLES_CRON:-30 6 * * *}
      JOB_RECONCILIATION_ENABLED: ${JOB_RECONCILIATION_ENABLED:-true}
      JOB_RECONCILIATION_CRON: ${JOB_RECONCILIATION_CRON:-0 7 * * *}
      JOB_DEFAULT_LOOKBACK_DAYS: ${JOB_DEFAULT_LOOKBACK_DAYS:-3}
      JOB_CLEANUP_OLD_LOGS_ENABLED: ${JOB_CLEANUP_OLD_LOGS_ENABLED:-false}
      JOB_CLEANUP_OLD_LOGS_CRON: ${JOB_CLEANUP_OLD_LOGS_CRON:-0 3 * * 0}
      JOB_LOG_RETENTION_DAYS: ${JOB_LOG_RETENTION_DAYS:-90}
    ports:
      - "${BACKEND_PORT:-3101}:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install && npm run prisma:generate && npm run dev"
    networks:
      - fip-core-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fip-core-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3101}
    ports:
      - "${FRONTEND_PORT:-3100}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"
    networks:
      - fip-core-network

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:

networks:
  fip-core-network:
    driver: bridge
